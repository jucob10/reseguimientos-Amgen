[server]
# Los reportes de Salesforce pueden pesar decenas de MB
maxUploadSize = 500
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4A9EE0"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A2230"
textColor = "#E6EAF0"

[client]
# Oculta el botón "Deploy" y el menú de desarrollador
toolbarMode = "viewer"
